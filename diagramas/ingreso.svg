<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560">
<style>/* SVG */
  .bx { fill: #f7f9fa; stroke: #c9d1d8; stroke-width: 1.5; }
  .bx-main { fill: #ffffff; stroke: #1c2630; stroke-width: 1.8; }
  .t1 { font: 600 16px Segoe UI, Arial, sans-serif; fill: #1c2630; }
  .t2 { font: 400 12.5px Segoe UI, Arial, sans-serif; fill: #5a6875; }
  .tm { font: 500 11.5px Consolas, Menlo, monospace; fill: #5a6875; }
  .lp { font: 500 12.5px Segoe UI, Arial, sans-serif; fill: #c77700; }
  .ld { font: 500 12.5px Segoe UI, Arial, sans-serif; fill: #1f67a8; }
  .lo { font: 600 12.5px Segoe UI, Arial, sans-serif; fill: #23865a; }
  .lm { font: 500 12px Segoe UI, Arial, sans-serif; fill: #7b8792; }
  .ap { stroke: #c77700; stroke-width: 2.4; fill: none; }
  .ad { stroke: #1f67a8; stroke-width: 2; fill: none; }
  .ao { stroke: #23865a; stroke-width: 3.2; fill: none; }
  .am { stroke: #7b8792; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
  .usb { stroke: #1f67a8; stroke-width: 2; fill: none; stroke-dasharray: 2 4; stroke-linecap: round; }
  .fig { fill: #c77700; }
  .n circle { stroke: #ffffff; stroke-width: 2; }
  .n text { font: 700 12px Segoe UI, Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .np circle { fill: #c77700; }
  .nd circle { fill: #1f67a8; }
  .no circle { fill: #23865a; }
  .mp { fill: #c77700; }
  .md { fill: #1f67a8; }
  .mo { fill: #23865a; }
  .mm { fill: #7b8792; }
  .zone { fill: none; stroke: #c9d1d8; stroke-width: 1; stroke-dasharray: 3 5; }
  .zl { font: 500 11px Consolas, Menlo, monospace; fill: #5a6875; letter-spacing: .06em; }
</style>
<rect width="1040" height="560" fill="#ffffff"/>

        <title id="ing-t">Diagrama del ingreso: lector de DNI, mini PC, G4 Pro con alcoholímetro y molinete de ingreso</title>
        <defs>
          <marker id="hp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mp"/></marker>
          <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="md"/></marker>
          <marker id="ho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mo"/></marker>
        </defs>

        <!-- zonas -->
        <rect class="zone" x="170" y="236" width="380" height="306" rx="8"/>
        <text class="zl" x="182" y="256">PUNTO DE VERIFICACIÓN</text>

        <!-- persona -->
        <g class="fig" transform="translate(58 250)">
          <circle cx="22" cy="14" r="13"/>
          <path d="M2 88 L2 44 Q2 32 14 32 L30 32 Q42 32 42 44 L42 88 Z"/>
          <rect x="6" y="86" width="12" height="36" rx="3"/>
          <rect x="26" y="86" width="12" height="36" rx="3"/>
        </g>
        <text class="t1" x="80" y="400" text-anchor="middle">Personal</text>

        <!-- lector DNI -->
        <rect class="bx" x="200" y="60" width="180" height="84" rx="8"/>
        <text class="t1" x="216" y="92">Lector de DNI</text>
        <text class="t2" x="216" y="112">Syble XB-7705H</text>
        <text class="tm" x="216" y="130">ingreso · USB-COM</text>

        <!-- mini PC -->
        <rect class="bx-main" x="470" y="30" width="250" height="144" rx="8"/>
        <text class="t1" x="488" y="62">Mini PC</text>
        <text class="t2" x="488" y="82">Sistema · base de datos · portal</text>
        <g class="n nd"><circle cx="499" cy="112" r="11"/><text x="499" y="112">3</text></g>
        <text class="t2" x="518" y="108">Revisa el DNI: registrado,</text>
        <text class="t2" x="518" y="125">no de baja, documentos al día</text>
        <text class="tm" x="488" y="158">decide quién queda habilitado</text>

        <!-- panel -->
        <rect class="bx" x="830" y="60" width="180" height="84" rx="8"/>
        <text class="t1" x="846" y="92">Panel de vigilancia</text>
        <text class="t2" x="846" y="112">en la pantalla del</text>
        <text class="t2" x="846" y="129">vigilante</text>

        <!-- G4 Pro -->
        <rect class="bx-main" x="330" y="280" width="200" height="104" rx="8"/>
        <text class="t1" x="348" y="312">G4 Pro</text>
        <text class="t2" x="348" y="332">terminal facial</text>
        <text class="t2" x="348" y="350">1.º rostro, 2.º alcohol</text>
        <text class="tm" x="348" y="370">relé "Lock" · Gate mode</text>

        <!-- DT1700 -->
        <rect class="bx" x="330" y="444" width="200" height="80" rx="8"/>
        <text class="t1" x="348" y="476">DT1700</text>
        <text class="t2" x="348" y="496">alcoholímetro</text>
        <text class="tm" x="348" y="513">Pass · Drink · Fail</text>

        <!-- molinete -->
        <rect class="bx-main" x="740" y="286" width="200" height="112" rx="8"/>
        <text class="t1" x="758" y="318">Molinete de ingreso</text>
        <text class="t2" x="758" y="338">TS2000 Plus</text>
        <text class="tm" x="758" y="362">bornera J3</text>
        <text class="tm" x="758" y="380">K1 + COM</text>


        <!-- 1: persona -> lector -->
        <path class="ap" d="M104 258 C130 190 150 110 196 104" marker-end="url(#hp)"/>
        <g class="n np"><circle cx="138" cy="170" r="11"/><text x="138" y="170">1</text></g>
        <text class="lp" x="152" y="196">pasa su DNI</text>

        <!-- 2: lector -> mini PC (USB) -->
        <path class="usb" d="M380 102 L466 102" marker-end="url(#hd)"/>
        <g class="n nd"><circle cx="423" cy="102" r="11"/><text x="423" y="102">2</text></g>
        <text class="ld" x="423" y="84" text-anchor="middle">USB</text>

        <!-- 4: mini PC -> G4 (habilita) -->
        <path class="ad" d="M520 174 L446 276" marker-end="url(#hd)"/>
        <g class="n nd"><circle cx="483" cy="225" r="11"/><text x="483" y="225">4</text></g>
        <text class="ld" x="468" y="210" text-anchor="end">red · habilita</text>
        <text class="ld" x="468" y="226" text-anchor="end">ese DNI 60 s</text>

        <!-- 8: G4 -> mini PC (registro) -->
        <path class="ad" d="M500 280 L592 178" marker-end="url(#hd)"/>
        <g class="n nd"><circle cx="546" cy="229" r="11"/><text x="546" y="229">8</text></g>
        <text class="ld" x="563" y="226">red · envía el ingreso</text>
        <text class="ld" x="563" y="242">y se deshabilita</text>

        <!-- 5: persona -> G4 (rostro) -->
        <path class="ap" d="M104 316 L326 324" marker-end="url(#hp)"/>
        <g class="n np"><circle cx="216" cy="320" r="11"/><text x="216" y="320">5</text></g>
        <text class="lp" x="216" y="302" text-anchor="middle">muestra el rostro</text>

        <!-- 6: persona -> DT1700 (sopla) -->
        <path class="ap" d="M104 360 C180 420 250 480 326 484" marker-end="url(#hp)"/>
        <g class="n np"><circle cx="220" cy="448" r="11"/><text x="220" y="448">6</text></g>
        <text class="lp" x="236" y="474">sopla</text>

        <!-- DT1700 -> G4 USB -->
        <path class="usb" d="M430 444 L430 388" marker-end="url(#hd)"/>
        <text class="ld" x="440" y="420">USB</text>

        <!-- 7: G4 -> molinete (señal) -->
        <path class="ao" d="M530 342 L734 342" marker-end="url(#ho)"/>
        <g class="n no"><circle cx="632" cy="342" r="11"/><text x="632" y="342">7</text></g>
        <text class="lo" x="632" y="324" text-anchor="middle">rostro y alcohol conformes</text>
        <text class="tm" x="632" y="366" text-anchor="middle">relé Lock (NO + COM) → J3</text>

        <!-- 9: mini PC -> panel -->
        <path class="ad" d="M720 102 L826 102" marker-end="url(#hd)"/>
        <g class="n nd"><circle cx="773" cy="102" r="11"/><text x="773" y="102">9</text></g>


        <!-- pasa -->
        <path class="ap" d="M940 342 L1024 342" marker-end="url(#hp)"/>
        <text class="lp" x="982" y="330" text-anchor="middle">pasa</text>
      </svg>
