<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" width="1040" height="670">
<style>/* SVG */
  .bx { fill: #f7f9fa; stroke: #c9d1d8; stroke-width: 1.5; }
  .bx-main { fill: #ffffff; stroke: #1c2630; stroke-width: 1.8; }
  .ch { fill: #eef3f8; stroke: #b9c9d9; stroke-width: 1; }
  .ci { fill: #e8f1fa; stroke: #1f67a8; stroke-width: 1; }
  .t1 { font: 600 16px Segoe UI, Arial, sans-serif; fill: #1c2630; }
  .t2 { font: 400 12.5px Segoe UI, Arial, sans-serif; fill: #5a6875; }
  .tc { font: 500 12px Segoe UI, Arial, sans-serif; fill: #1c2630; text-anchor: middle; dominant-baseline: central; }
  .tci { font: 500 12px Segoe UI, Arial, sans-serif; fill: #1f67a8; text-anchor: middle; dominant-baseline: central; }
  .tm { font: 500 11.5px Consolas, Menlo, monospace; fill: #5a6875; }
  .ld { font: 500 12.5px Segoe UI, Arial, sans-serif; fill: #1f67a8; }
  .lm { font: 500 12px Segoe UI, Arial, sans-serif; fill: #7b8792; }
  .ad { stroke: #1f67a8; stroke-width: 2; fill: none; }
  .am { stroke: #7b8792; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
  .md { fill: #1f67a8; }
  .mm { fill: #7b8792; }
  .zone { fill: none; stroke: #c9d1d8; stroke-width: 1; stroke-dasharray: 3 5; }
  .zl { font: 500 11px Consolas, Menlo, monospace; fill: #5a6875; letter-spacing: .06em; }
  .c { text-anchor: middle; }
</style>
<rect width="1040" height="670" fill="#ffffff"/>
<title>Arquitectura de software del Sistema de Control de Accesos</title>
<defs>
  <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="md"/></marker>
  <marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mm"/></marker>
</defs>

<!-- clientes -->
<rect class="bx" x="120" y="16" width="300" height="80" rx="8"/>
<text class="t1 c" x="270" y="49">Navegador web</text>
<text class="t2 c" x="270" y="71">Administrador · Vigilancia</text>

<rect class="bx" x="660" y="16" width="340" height="80" rx="8"/>
<text class="t1 c" x="830" y="42">Equipos de garita</text>
<text class="t2 c" x="830" y="64">Terminal facial con alcoholímetro</text>
<text class="t2 c" x="830" y="83">Lectores de DNI · Molinetes</text>

<!-- mini PC -->
<rect class="zone" x="30" y="120" width="980" height="530" rx="10"/>
<text class="zl" x="440" y="140">MINI PC · DOCKER · UBUNTU SERVER · RED LOCAL</text>

<!-- presentación -->
<rect class="bx-main" x="60" y="160" width="720" height="110" rx="8"/>
<text class="t1" x="80" y="188">Portal web (presentación)</text>
<text class="tm" x="80" y="208">contenedor portal · Next.js 16 · React 19 · Tailwind CSS 4 · ApexCharts</text>
<g>
  <rect class="ch" x="80" y="224" width="80" height="30" rx="6"/><text class="tc" x="120" y="239">Dashboard</text>
  <rect class="ch" x="166" y="224" width="72" height="30" rx="6"/><text class="tc" x="202" y="239">Reportes</text>
  <rect class="ch" x="244" y="224" width="146" height="30" rx="6"/><text class="tc" x="317" y="239">Personal y documentos</text>
  <rect class="ch" x="396" y="224" width="124" height="30" rx="6"/><text class="tc" x="458" y="239">Panel de vigilancia</text>
  <rect class="ch" x="526" y="224" width="70" height="30" rx="6"/><text class="tc" x="561" y="239">Auditoría</text>
  <rect class="ch" x="602" y="224" width="102" height="30" rx="6"/><text class="tc" x="653" y="239">Sistema y APIs</text>
  <rect class="ch" x="710" y="224" width="58" height="30" rx="6"/><text class="tc" x="739" y="239">Manual</text>
</g>

<!-- aplicación -->
<rect class="bx-main" x="60" y="320" width="940" height="180" rx="8"/>
<text class="t1" x="80" y="348">Backend (API · reglas de negocio)</text>
<text class="tm" x="80" y="368">contenedor api · NestJS 12 · Node.js 22 · TypeScript</text>
<g>
  <rect class="ci" x="80" y="382" width="130" height="30" rx="6"/><text class="tci" x="145" y="397">API REST /api/v1</text>
  <rect class="ci" x="218" y="382" width="164" height="30" rx="6"/><text class="tci" x="300" y="397">WebSocket (Socket.IO)</text>
  <rect class="ci" x="390" y="382" width="140" height="30" rx="6"/><text class="tci" x="460" y="397">Swagger (OpenAPI)</text>
  <rect class="ci" x="538" y="382" width="120" height="30" rx="6"/><text class="tci" x="598" y="397">Sesiones JWT</text>
  <rect class="ci" x="666" y="382" width="130" height="30" rx="6"/><text class="tci" x="731" y="397">Clave de equipo</text>
</g>
<g>
  <rect class="ch" x="80" y="422" width="100" height="30" rx="6"/><text class="tc" x="130" y="437">Autenticación</text>
  <rect class="ch" x="188" y="422" width="136" height="30" rx="6"/><text class="tc" x="256" y="437">Empresas y personal</text>
  <rect class="ch" x="332" y="422" width="84" height="30" rx="6"/><text class="tc" x="374" y="437">Documentos</text>
  <rect class="ch" x="424" y="422" width="140" height="30" rx="6"/><text class="tc" x="494" y="437">Motor de validación</text>
  <rect class="ch" x="572" y="422" width="126" height="30" rx="6"/><text class="tc" x="635" y="437">Eventos de acceso</text>
  <rect class="ch" x="706" y="422" width="78" height="30" rx="6"/><text class="tc" x="745" y="437">Auditoría</text>
  <rect class="ch" x="792" y="422" width="180" height="30" rx="6"/><text class="tc" x="882" y="437">Panel, dashboard y respaldos</text>
  <rect class="ch" x="80" y="460" width="150" height="30" rx="6"/><text class="tc" x="155" y="475">Reportes (Excel / PDF)</text>
</g>
<text class="tm" x="244" y="479">acceso a datos · Prisma 7 (ORM) · migraciones automáticas al arrancar</text>

<!-- datos -->
<rect class="bx" x="60" y="540" width="280" height="80" rx="8"/>
<text class="t1" x="80" y="566">PostgreSQL 16</text>
<text class="t2" x="80" y="587">contenedor db · empresas, personal,</text>
<text class="t2" x="80" y="605">documentos, eventos, usuarios, auditoría</text>

<rect class="bx" x="380" y="540" width="280" height="80" rx="8"/>
<text class="t1" x="400" y="566">Documentos y fotos</text>
<text class="t2" x="400" y="587">volumen en disco</text>
<text class="t2" x="400" y="605">PDF, imágenes, Word y fotos del personal</text>

<rect class="bx" x="720" y="540" width="280" height="80" rx="8"/>
<text class="t1" x="740" y="566">Respaldo diario</text>
<text class="t2" x="740" y="587">contenedor backup · 00:00</text>
<text class="t2" x="740" y="605">base de datos + archivos · 14 días</text>

<!-- flechas -->
<line class="ad" x1="270" y1="96" x2="270" y2="157" marker-end="url(#hd)"/>
<text class="ld" x="280" y="128">HTTP</text>

<line class="ad" x1="420" y1="273" x2="420" y2="317" marker-start="url(#hd)" marker-end="url(#hd)"/>
<text class="ld" x="432" y="300">HTTP REST + WebSocket (tiempo real)</text>

<line class="ad" x1="890" y1="99" x2="890" y2="317" marker-start="url(#hd)" marker-end="url(#hd)"/>
<text class="ld" x="800" y="196">Ingresos</text>
<text class="ld" x="800" y="213">y salidas</text>
<text class="lm" x="900" y="196">HTTP +</text>
<text class="lm" x="900" y="213">clave de</text>
<text class="lm" x="900" y="230">equipo</text>

<line class="ad" x1="200" y1="500" x2="200" y2="537" marker-end="url(#hd)"/>
<text class="ld" x="210" y="523">Prisma (SQL)</text>
<line class="ad" x1="520" y1="500" x2="520" y2="537" marker-end="url(#hd)"/>
<text class="ld" x="530" y="523">lectura / escritura</text>

<line class="am" x1="660" y1="580" x2="717" y2="580" marker-end="url(#hm)"/>
<path class="am" d="M200 620 V642 H860 V623" marker-end="url(#hm)"/>
<text class="lm" x="560" y="633">copia diaria</text>
</svg>
