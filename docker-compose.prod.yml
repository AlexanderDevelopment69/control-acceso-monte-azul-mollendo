# Servidor completo (portal, API, base de datos, respaldos), todo en contenedores.
#   docker compose -f docker-compose.prod.yml up -d --build
# Sirve para dos entornos; las claves van en un .env junto a este archivo:
#   nube   → deploy/nube.env.example   (AWS/Azure; molinetes en el controlador de la garita)
#   garita → deploy/garita.env.example (opcional: la mini PC como servidor, con lectores y relés por USB)
# Guía completa: Registro_Despliegue_MiniPC.md
name: mollendo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mollendo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      POSTGRES_DB: mollendo_control_acceso
      TZ: America/Lima
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mollendo -d mollendo_control_acceso"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./mollendo-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mollendo:${DB_PASSWORD}@db:5432/mollendo_control_acceso?schema=public
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET en .env}
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DOCUMENTOS_STORAGE_PATH: /app/storage/documentos
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Falta DEVICE_API_KEY en .env}
      SWAGGER: "true"
      RESPALDOS_PATH: /app/respaldos
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:-admin@mollendo.local}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      VIGILANCIA_SEED_EMAIL: ${VIGILANCIA_SEED_EMAIL:-vigilancia@mollendo.local}
      VIGILANCIA_SEED_PASSWORD: ${VIGILANCIA_SEED_PASSWORD:-}
      # Lectores de DNI por RS232 (solo en el servidor que los tiene conectados):
      # en .env, LECTOR_DNI_INGRESO_DISPOSITIVO / LECTOR_DNI_SALIDA_DISPOSITIVO con
      # la ruta fija del adaptador (/dev/serial/by-id/...). Sin esas variables no
      # se abre ningún puerto.
      LECTOR_DNI_INGRESO_PUERTO: ${LECTOR_DNI_INGRESO_DISPOSITIVO:-}
      LECTOR_DNI_SALIDA_PUERTO: ${LECTOR_DNI_SALIDA_DISPOSITIVO:-}
      LECTOR_DNI_BAUDIOS: ${LECTOR_DNI_BAUDIOS:-115200}
      # El /dev del servidor, de solo lectura: el lector se busca por su ruta fija
      # cada vez que se reintenta, así se recupera aunque al desconectar y volver a
      # conectar el adaptador Linux le dé otro número (ttyUSB0 -> ttyUSB1).
      LECTOR_DNI_DEV_SERVIDOR: /dev-servidor
      # Módulos de relés USB (DCTTECH USBRelay) que abren los molinetes: cada
      # molinete con el número de serie de su módulo y el relé de ese módulo
      # (1 por defecto). Sin número de serie se usa el único módulo conectado.
      RELE_INGRESO_SERIE: ${RELE_INGRESO_SERIE:-}
      RELE_INGRESO_CANAL: ${RELE_INGRESO_CANAL:-1}
      RELE_SALIDA_SERIE: ${RELE_SALIDA_SERIE:-}
      RELE_SALIDA_CANAL: ${RELE_SALIDA_CANAL:-1}
      RELE_PULSO_MS: ${RELE_PULSO_MS:-1000}
      # Relés de aviso: contacto seco en cada ingreso o salida denegados (luz, sirena…).
      # Solo con número de serie (RELE_AVISO_SERIE es el nombre anterior del de ingreso).
      RELE_AVISO_SERIE: ${RELE_AVISO_SERIE:-}
      RELE_AVISO_INGRESO_SERIE: ${RELE_AVISO_INGRESO_SERIE:-}
      RELE_AVISO_INGRESO_CANAL: ${RELE_AVISO_INGRESO_CANAL:-}
      RELE_AVISO_SALIDA_SERIE: ${RELE_AVISO_SALIDA_SERIE:-}
      RELE_AVISO_SALIDA_CANAL: ${RELE_AVISO_SALIDA_CANAL:-1}
      RELE_AVISO_PULSO_MS: ${RELE_AVISO_PULSO_MS:-}
      # true cuando los lectores y relés están en un controlador conectado por
      # internet (servidor en la nube; ver docker-compose.controlador.yml): la orden de
      # abrir los molinetes se le manda a él.
      MOLINETES_REMOTOS: ${MOLINETES_REMOTOS:-false}
      # true: anota en el registro todo lo que envía el G4 Pro (para estudiar el equipo).
      PUSH_SDK_DEPURAR: ${PUSH_SDK_DEPURAR:-false}
      # Hora de la sincronización diaria con los G4 Pro (0 = medianoche, hora de Lima).
      G4PRO_HORA_SINCRONIZACION: ${G4PRO_HORA_SINCRONIZACION:-0}
    # Solo puertos serie USB (ttyUSB = 188, ttyACM = 166, los lectores de DNI) y
    # dispositivos HID en bruto (hidraw, el módulo de relés USB de los molinetes;
    # su número lo asigna el kernel: ver `grep hidraw /proc/devices`).
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
      - "c ${RELE_USB_HIDRAW_MAJOR:-234}:* rmw"
    volumes:
      - /dev:/dev-servidor:ro
      - documentos:/app/storage
      # Solo lectura: para mostrar el último respaldo en "Sistema y APIs".
      - ./backups:/app/respaldos:ro
    ports:
      - "3001:3001" # equipos (ingreso/salida con X-API-Key) y Swagger

  portal:
    build: ./mollendo-portal
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Respaldo diario (base de datos + documentos y fotos) en ./backups, a las
  # HORA_RESPALDO (por defecto 00:00, hora de Lima); se guardan 14 días.
  # Ver deploy/respaldo.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      TZ: America/Lima
      HORA_RESPALDO: ${HORA_RESPALDO:-00:00}
    volumes:
      - ./backups:/backups
      - ./deploy/respaldo.sh:/respaldo.sh:ro
      - documentos:/storage:ro
    entrypoint: ["sh", "/respaldo.sh"]

  # Enlace público TEMPORAL para mostrar el portal a cualquiera (túnel rápido
  # de Cloudflare, sin cuenta). Apagado por defecto: solo se levanta con el
  # perfil "muestra". Cada vez que arranca, el enlace cambia.
  #   Encender: docker compose -f docker-compose.prod.yml --profile muestra up -d muestra
  #   Ver enlace: docker compose -f docker-compose.prod.yml logs muestra | grep trycloudflare
  #   Apagar:   docker compose -f docker-compose.prod.yml --profile muestra rm -sf muestra
  muestra:
    image: cloudflare/cloudflared:latest
    profiles: ["muestra"]
    restart: "no"
    depends_on:
      - portal
    command: tunnel --no-autoupdate --url http://portal:3000

volumes:
  db_data:
  documentos:
