# Entorno LOCAL: PostgreSQL para desarrollo (puerto 5433). Ver README.md de esta carpeta.
#   docker compose up -d
# El nombre fija el proyecto de siempre, así se sigue usando el mismo volumen de datos.
name: proyectomollendo

services:
  postgres:
    image: postgres:16-alpine
    container_name: mollendo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mollendo_control_acceso
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d mollendo_control_acceso"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
