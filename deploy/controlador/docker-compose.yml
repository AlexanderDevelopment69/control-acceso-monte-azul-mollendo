# Entorno CONTROLADOR: Controlador (PC) del punto de acceso cuando el servidor está en la nube.
# Solo lectores de DNI y relés de los molinetes, conectada al servidor; usa la
# misma imagen que la API, arrancada en modo controlador (src/controlador/).
# Sin base de datos ni portal. Ver README.md de esta carpeta.
#   cp .env.example .env    (y completar)
#   docker compose up -d --build
name: mollendo-controlador

services:
  controlador:
    # Nombre fijo (sin el "-1" que agrega Docker), como los del servidor.
    container_name: mollendo-controlador
    build: ../../mollendo-api
    image: mollendo-controlador
    restart: unless-stopped
    command: ["node", "dist/controlador/main.js"]
    # Usa la red del Controlador (PC) (no una red interna de Docker): así informa su IP
    # real en la garita y no puede chocar con las redes de TMAM (el 16/10/2026 la
    # red interna 172.20.0.0/16 chocaba con la de los biométricos, 172.20.20.x).
    # El controlador solo hace conexiones de salida: no publica puertos.
    network_mode: host
    environment:
      SERVIDOR_URL: ${SERVIDOR_URL:?Falta SERVIDOR_URL (servidor en la nube)}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Falta DEVICE_API_KEY (la clave de equipos del servidor)}
      CONTROLADOR_DATOS: /app/datos-controlador
      LECTOR_DNI_INGRESO_PUERTO: ${LECTOR_DNI_INGRESO_DISPOSITIVO:-}
      LECTOR_DNI_SALIDA_PUERTO: ${LECTOR_DNI_SALIDA_DISPOSITIVO:-}
      LECTOR_DNI_BAUDIOS: ${LECTOR_DNI_BAUDIOS:-115200}
      LECTOR_DNI_DEV_SERVIDOR: /dev-servidor
      RELE_INGRESO_SERIE: ${RELE_INGRESO_SERIE:-}
      RELE_INGRESO_CANAL: ${RELE_INGRESO_CANAL:-1}
      RELE_SALIDA_SERIE: ${RELE_SALIDA_SERIE:-}
      RELE_SALIDA_CANAL: ${RELE_SALIDA_CANAL:-1}
      RELE_PULSO_MS: ${RELE_PULSO_MS:-1000}
      # Relés de aviso: contacto seco en cada ingreso o salida denegados (luz, sirena…).
      # Solo con número de serie (RELE_AVISO_SERIE es el nombre anterior del de ingreso).
      RELE_AVISO_SERIE: ${RELE_AVISO_SERIE:-}
      RELE_AVISO_INGRESO_SERIE: ${RELE_AVISO_INGRESO_SERIE:-}
      RELE_AVISO_INGRESO_CANAL: ${RELE_AVISO_INGRESO_CANAL:-}
      RELE_AVISO_SALIDA_SERIE: ${RELE_AVISO_SALIDA_SERIE:-}
      RELE_AVISO_SALIDA_CANAL: ${RELE_AVISO_SALIDA_CANAL:-1}
      RELE_AVISO_PULSO_MS: ${RELE_AVISO_PULSO_MS:-}
      # "alterno": un contacto prende el aviso y el siguiente lo apaga (el pitido de los
      # torniquetes); se dan dos pulsos separados por RELE_AVISO_ALTERNO_MS. Vacío = un pulso.
      RELE_AVISO_INGRESO_MODO: ${RELE_AVISO_INGRESO_MODO:-}
      RELE_AVISO_SALIDA_MODO: ${RELE_AVISO_SALIDA_MODO:-}
      RELE_AVISO_ALTERNO_MS: ${RELE_AVISO_ALTERNO_MS:-3000}
    # Igual que la API de la garita: puertos serie USB (lectores) y hidraw (relés).
    # Registro del kernel (/dev/kmsg, solo lectura): para detectar un adaptador USB de
    # lector trabado (error -71; visto el 20-21/10/2026). SYSLOG es el permiso para leerlo.
    cap_add:
      - SYSLOG
    device_cgroup_rules:
      - "c 1:11 r"
      - "c 188:* rmw"
      - "c 166:* rmw"
      # Relés USB (hidraw): el kernel les da un número al arrancar, dentro del rango
      # dinámico 234-254, y puede cambiar en cada reinicio (15/10/2026 pasó de 234 a
      # 238 y los molinetes dejaron de abrir). Se permite todo el rango.
      - "c 234:* rmw"
      - "c 235:* rmw"
      - "c 236:* rmw"
      - "c 237:* rmw"
      - "c 238:* rmw"
      - "c 239:* rmw"
      - "c 240:* rmw"
      - "c 241:* rmw"
      - "c 242:* rmw"
      - "c 243:* rmw"
      - "c 244:* rmw"
      - "c 245:* rmw"
      - "c 246:* rmw"
      - "c 247:* rmw"
      - "c 248:* rmw"
      - "c 249:* rmw"
      - "c 250:* rmw"
      - "c 251:* rmw"
      - "c 252:* rmw"
      - "c 253:* rmw"
      - "c 254:* rmw"
    volumes:
      - /dev:/dev-servidor:ro
      # Lista del personal para las salidas sin conexión y salidas pendientes de enviar.
      - datos-controlador:/app/datos-controlador

  # Copia diaria de los respaldos del servidor en esta PC (./copia/respaldos): si se
  # pierde el servidor, los datos siguen aquí. Solo con el perfil "copia"
  # (COMPOSE_PROFILES=copia en .env, lo deja instalar.sh). Ver copia-respaldos.sh.
  copia-respaldos:
    container_name: mollendo-copia-respaldos
    image: alpine:3.22
    profiles: ["copia"]
    restart: unless-stopped
    environment:
      COPIA_ORIGEN: ${COPIA_ORIGEN:-}
      HORA_COPIA: ${HORA_COPIA:-05:00}
      DIAS_COPIA: ${DIAS_COPIA:-30}
      TZ: America/Lima
    volumes:
      - ./copia:/copia
      - ./copia-respaldos.sh:/copia-respaldos.sh:ro
    entrypoint: ["sh", "/copia-respaldos.sh"]
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  datos-controlador:
