# Entorno CONTROLADOR: mini PC de la garita cuando el servidor está en la nube.
# Solo lectores de DNI y relés de los molinetes, conectada al servidor; usa la
# misma imagen que la API, arrancada en modo controlador (src/controlador/).
# Sin base de datos ni portal. Ver README.md de esta carpeta.
#   cp .env.example .env    (y completar)
#   docker compose up -d --build
name: mollendo-controlador

services:
  controlador:
    build: ../../mollendo-api
    image: mollendo-controlador
    restart: unless-stopped
    command: ["node", "dist/controlador/main.js"]
    environment:
      SERVIDOR_URL: ${SERVIDOR_URL:?Falta SERVIDOR_URL (servidor en la nube)}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Falta DEVICE_API_KEY (la clave de equipos del servidor)}
      CONTROLADOR_DATOS: /app/datos-controlador
      LECTOR_DNI_INGRESO_PUERTO: ${LECTOR_DNI_INGRESO_DISPOSITIVO:-}
      LECTOR_DNI_SALIDA_PUERTO: ${LECTOR_DNI_SALIDA_DISPOSITIVO:-}
      LECTOR_DNI_BAUDIOS: ${LECTOR_DNI_BAUDIOS:-115200}
      LECTOR_DNI_DEV_SERVIDOR: /dev-servidor
      RELE_INGRESO_SERIE: ${RELE_INGRESO_SERIE:-}
      RELE_INGRESO_CANAL: ${RELE_INGRESO_CANAL:-1}
      RELE_SALIDA_SERIE: ${RELE_SALIDA_SERIE:-}
      RELE_SALIDA_CANAL: ${RELE_SALIDA_CANAL:-1}
      RELE_PULSO_MS: ${RELE_PULSO_MS:-1000}
      # Relés de aviso: contacto seco en cada ingreso o salida denegados (luz, sirena…).
      # Solo con número de serie (RELE_AVISO_SERIE es el nombre anterior del de ingreso).
      RELE_AVISO_SERIE: ${RELE_AVISO_SERIE:-}
      RELE_AVISO_INGRESO_SERIE: ${RELE_AVISO_INGRESO_SERIE:-}
      RELE_AVISO_INGRESO_CANAL: ${RELE_AVISO_INGRESO_CANAL:-}
      RELE_AVISO_SALIDA_SERIE: ${RELE_AVISO_SALIDA_SERIE:-}
      RELE_AVISO_SALIDA_CANAL: ${RELE_AVISO_SALIDA_CANAL:-1}
      RELE_AVISO_PULSO_MS: ${RELE_AVISO_PULSO_MS:-}
    # Igual que la API de la mini PC: puertos serie USB (lectores) y hidraw (relés).
    device_cgroup_rules:
      - "c 188:* rmw"
      - "c 166:* rmw"
      - "c ${RELE_USB_HIDRAW_MAJOR:-234}:* rmw"
    volumes:
      - /dev:/dev-servidor:ro
      # Lista del personal para las salidas sin conexión y salidas pendientes de enviar.
      - datos-controlador:/app/datos-controlador

volumes:
  datos-controlador:
