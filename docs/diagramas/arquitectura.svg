<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" width="1040" height="900">
<style>/* SVG */
  .bx { fill: #f7f9fa; stroke: #c9d1d8; stroke-width: 1.5; }
  .bx-main { fill: #ffffff; stroke: #1c2630; stroke-width: 1.8; }
  .ch { fill: #eef3f8; stroke: #b9c9d9; stroke-width: 1; }
  .ci { fill: #e8f1fa; stroke: #1f67a8; stroke-width: 1; }
  .t1 { font: 600 16px Segoe UI, Arial, sans-serif; fill: #1c2630; }
  .t2 { font: 400 12.5px Segoe UI, Arial, sans-serif; fill: #5a6875; }
  .tc { font: 500 12px Segoe UI, Arial, sans-serif; fill: #1c2630; text-anchor: middle; dominant-baseline: central; }
  .tci { font: 500 12px Segoe UI, Arial, sans-serif; fill: #1f67a8; text-anchor: middle; dominant-baseline: central; }
  .tm { font: 500 11.5px Consolas, Menlo, monospace; fill: #5a6875; }
  .ld { font: 500 12.5px Segoe UI, Arial, sans-serif; fill: #1f67a8; }
  .lm { font: 500 12px Segoe UI, Arial, sans-serif; fill: #7b8792; }
  .ad { stroke: #1f67a8; stroke-width: 2; fill: none; }
  .am { stroke: #7b8792; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; }
  .md { fill: #1f67a8; }
  .mm { fill: #7b8792; }
  .zone { fill: none; stroke: #c9d1d8; stroke-width: 1; stroke-dasharray: 3 5; }
  .zl { font: 500 11px Consolas, Menlo, monospace; fill: #5a6875; letter-spacing: .06em; }
  .c { text-anchor: middle; }
</style>
<rect width="1040" height="900" fill="#ffffff"/>
<title>Arquitectura de software del Sistema de Control de Accesos: servidor en la nube y mini PC de la garita como controlador</title>
<defs>
  <marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="md"/></marker>
  <marker id="hm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mm"/></marker>
</defs>

<!-- clientes -->
<rect class="bx" x="120" y="16" width="300" height="80" rx="8"/>
<text class="t1 c" x="270" y="49">Navegador web</text>
<text class="t2 c" x="270" y="71">Administrador · Vigilancia</text>

<!-- servidor en la nube -->
<rect class="zone" x="30" y="120" width="980" height="544" rx="10"/>
<text class="zl" x="380" y="140">SERVIDOR EN LA NUBE · AWS · DOCKER · UBUNTU SERVER</text>

<!-- presentación -->
<rect class="bx-main" x="60" y="160" width="720" height="110" rx="8"/>
<text class="t1" x="80" y="188">Portal web (presentación)</text>
<text class="tm" x="80" y="208">contenedor portal · Next.js 16 · React 19 · Tailwind CSS 4 · ApexCharts</text>
<g>
  <rect class="ch" x="80" y="224" width="80" height="30" rx="6"/><text class="tc" x="120" y="239">Dashboard</text>
  <rect class="ch" x="166" y="224" width="72" height="30" rx="6"/><text class="tc" x="202" y="239">Reportes</text>
  <rect class="ch" x="244" y="224" width="146" height="30" rx="6"/><text class="tc" x="317" y="239">Personal y documentos</text>
  <rect class="ch" x="396" y="224" width="124" height="30" rx="6"/><text class="tc" x="458" y="239">Panel de vigilancia</text>
  <rect class="ch" x="526" y="224" width="70" height="30" rx="6"/><text class="tc" x="561" y="239">Auditoría</text>
  <rect class="ch" x="602" y="224" width="102" height="30" rx="6"/><text class="tc" x="653" y="239">Sistema y APIs</text>
  <rect class="ch" x="710" y="224" width="58" height="30" rx="6"/><text class="tc" x="739" y="239">Manual</text>
</g>

<!-- aplicación -->
<rect class="bx-main" x="60" y="320" width="940" height="200" rx="8"/>
<text class="t1" x="80" y="348">Backend (API · reglas de negocio)</text>
<text class="tm" x="80" y="368">contenedor api · NestJS 12 · Node.js 22 · TypeScript</text>
<g>
  <rect class="ci" x="80" y="382" width="130" height="30" rx="6"/><text class="tci" x="145" y="397">API REST /api/v1</text>
  <rect class="ci" x="218" y="382" width="190" height="30" rx="6"/><text class="tci" x="313" y="397">WebSocket del panel (Socket.IO)</text>
  <rect class="ci" x="416" y="382" width="176" height="30" rx="6"/><text class="tci" x="504" y="397">Canal del controlador</text>
  <rect class="ci" x="600" y="382" width="140" height="30" rx="6"/><text class="tci" x="670" y="397">Swagger (OpenAPI)</text>
  <rect class="ci" x="748" y="382" width="104" height="30" rx="6"/><text class="tci" x="800" y="397">Sesiones JWT</text>
  <rect class="ci" x="860" y="382" width="124" height="30" rx="6"/><text class="tci" x="922" y="397">Clave de equipo</text>
</g>
<g>
  <rect class="ch" x="80" y="422" width="100" height="30" rx="6"/><text class="tc" x="130" y="437">Autenticación</text>
  <rect class="ch" x="188" y="422" width="136" height="30" rx="6"/><text class="tc" x="256" y="437">Empresas y personal</text>
  <rect class="ch" x="332" y="422" width="84" height="30" rx="6"/><text class="tc" x="374" y="437">Documentos</text>
  <rect class="ch" x="424" y="422" width="140" height="30" rx="6"/><text class="tc" x="494" y="437">Motor de validación</text>
  <rect class="ch" x="572" y="422" width="126" height="30" rx="6"/><text class="tc" x="635" y="437">Eventos de acceso</text>
  <rect class="ch" x="706" y="422" width="78" height="30" rx="6"/><text class="tc" x="745" y="437">Auditoría</text>
  <rect class="ch" x="792" y="422" width="190" height="30" rx="6"/><text class="tc" x="887" y="437">Panel, dashboard y respaldos</text>
  <rect class="ch" x="80" y="460" width="150" height="30" rx="6"/><text class="tc" x="155" y="475">Reportes (Excel / PDF)</text>
  <rect class="ch" x="238" y="460" width="180" height="30" rx="6"/><text class="tc" x="328" y="475">Integración G4 Pro (PUSH)</text>
  <rect class="ch" x="426" y="460" width="190" height="30" rx="6"/><text class="tc" x="521" y="475">Molinetes remotos y avisos</text>
</g>
<text class="tm" x="80" y="508">acceso a datos · Prisma 7 (ORM) · migraciones automáticas al arrancar</text>

<!-- datos -->
<rect class="bx" x="60" y="560" width="240" height="80" rx="8"/>
<text class="t1" x="80" y="586">PostgreSQL 16</text>
<text class="t2" x="80" y="607">contenedor db · empresas, personal,</text>
<text class="t2" x="80" y="625">documentos, eventos, auditoría</text>

<rect class="bx" x="330" y="560" width="240" height="80" rx="8"/>
<text class="t1" x="350" y="586">Documentos y fotos</text>
<text class="t2" x="350" y="607">volumen en disco · PDF, imágenes,</text>
<text class="t2" x="350" y="625">Word y fotos del personal</text>

<rect class="bx" x="600" y="560" width="200" height="80" rx="8"/>
<text class="t1" x="620" y="586">Respaldo diario</text>
<text class="t2" x="620" y="607">contenedor backup · 00:00</text>
<text class="t2" x="620" y="625">base + archivos · 14 días</text>

<!-- garita -->
<rect class="zone" x="30" y="696" width="980" height="188" rx="10"/>
<text class="zl" x="50" y="716">GARITA · CONECTADA AL SERVIDOR POR INTERNET</text>

<rect class="bx-main" x="60" y="730" width="540" height="140" rx="8"/>
<text class="t1" x="80" y="758">Mini PC · controlador</text>
<text class="tm" x="80" y="778">contenedor controlador · la misma imagen del backend, en modo controlador</text>
<g>
  <rect class="ch" x="80" y="792" width="150" height="30" rx="6"/><text class="tc" x="155" y="807">Lectores de DNI (USB)</text>
  <rect class="ch" x="238" y="792" width="170" height="30" rx="6"/><text class="tc" x="323" y="807">Relés de los molinetes (USB)</text>
  <rect class="ch" x="416" y="792" width="168" height="30" rx="6"/><text class="tc" x="500" y="807">Relés de aviso (luz o sirena)</text>
  <rect class="ch" x="80" y="830" width="260" height="30" rx="6"/><text class="tc" x="210" y="845">Lista del personal (salidas sin internet)</text>
</g>
<text class="t2" x="352" y="849">sin base de datos ni portal</text>

<rect class="bx" x="640" y="730" width="340" height="140" rx="8"/>
<text class="t1" x="660" y="758">G4 Pro + DT1700</text>
<text class="t2" x="660" y="780">terminal facial con alcoholímetro</text>
<text class="tm" x="660" y="800">protocolo PUSH del fabricante (HTTP)</text>
<text class="t2" x="660" y="826">reconoce el rostro y toma la prueba de</text>
<text class="t2" x="660" y="844">alcohol; no abre el molinete</text>

<!-- flechas -->
<line class="ad" x1="270" y1="96" x2="270" y2="157" marker-end="url(#hd)"/>
<text class="ld" x="280" y="128">HTTP</text>

<line class="ad" x1="420" y1="273" x2="420" y2="317" marker-start="url(#hd)" marker-end="url(#hd)"/>
<text class="ld" x="432" y="300">HTTP REST + WebSocket (tiempo real)</text>

<path class="ad" d="M540 727 V680 H840 V523" marker-start="url(#hd)" marker-end="url(#hd)"/>
<text class="ld" x="850" y="566">DNI leídos,</text>
<text class="ld" x="850" y="582">órdenes de abrir</text>

<line class="ad" x1="960" y1="727" x2="960" y2="523" marker-start="url(#hd)" marker-end="url(#hd)"/>
<text class="ld" x="950" y="620" text-anchor="end">rostro, alcohol,</text>
<text class="ld" x="950" y="636" text-anchor="end">habilitaciones</text>

<line class="ad" x1="180" y1="520" x2="180" y2="557" marker-end="url(#hd)"/>
<line class="ad" x1="450" y1="520" x2="450" y2="557" marker-end="url(#hd)"/>

<line class="am" x1="570" y1="600" x2="597" y2="600" marker-end="url(#hm)"/>
<path class="am" d="M180 640 V654 H700 V643" marker-end="url(#hm)"/>
<text class="lm" x="460" y="650">copia diaria</text>
</svg>
