<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" role="img" aria-labelledby="sal-t">
<title id="sal-t">Salida: el lector envía el DNI al Controlador (PC) de la garita, que lo manda al servidor en la nube; el servidor verifica que esté registrado, guarda la salida y ordena al Controlador (PC) un pulso del relé que abre el molinete de salida</title>
<style>
  text { font-family: Segoe UI, Arial, sans-serif; }
  .bx { fill: #ffffff; stroke: #c3ccd4; stroke-width: 1.5; }
  .bxm { fill: #ffffff; stroke: #1c2630; stroke-width: 2; }
  .ti { font-size: 16px; font-weight: 600; fill: #1c2630; }
  .su { font-size: 12.5px; fill: #5a6875; }
  .tg { font: 600 10.5px Consolas, Menlo, monospace; fill: #7b8792; letter-spacing: .03em; }
  .dl { font-size: 12.5px; fill: #3d4852; }
  .dlb { font-size: 12.5px; font-weight: 600; fill: #1c2630; }
  .zone { fill: #f6f8fa; stroke: #d5dce2; stroke-width: 1; stroke-dasharray: 4 5; }
  .zl { font: 600 11px Consolas, Menlo, monospace; fill: #7b8792; letter-spacing: .08em; }
  .lp { font-size: 12.5px; font-weight: 600; fill: #c77700; }
  .lb { font-size: 12.5px; font-weight: 600; fill: #1f67a8; }
  .lg { font-size: 12.5px; font-weight: 600; fill: #23865a; }
  .num { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .h2 { font-size: 15px; font-weight: 700; fill: #1c2630; }
  .st { font-size: 13px; fill: #3d4852; }
  .xt { font-size: 13px; font-weight: 700; fill: #c0392b; }
  .xl { font-size: 12.5px; fill: #3d4852; }
</style>
<defs>
  <marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c77700"/></marker>
  <marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1f67a8"/></marker>
  <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#23865a"/></marker>
  <marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c0392b"/></marker>
</defs>
<rect width="1400" height="940" fill="#ffffff"/>

<!-- Servidor en la nube -->
<rect class="bxm" x="470" y="30" width="460" height="220" rx="10"/>
<text class="ti" x="486" y="60">Servidor en la nube</text>
<text class="su" x="486" y="80">AWS · sistema · base de datos · portal</text>
<line x1="486" y1="92" x2="914" y2="92" stroke="#e3e8ec"/>
<circle cx="498" cy="118" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="498" y="118">4</text>
<text class="dl" x="518" y="122"><tspan class="dlb">Verifica el DNI:</tspan> que esté registrado</text>
<circle cx="498" cy="152" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="498" y="152">4</text>
<text class="dl" x="518" y="156"><tspan class="dlb">Guarda</tspan> la salida (también si está de baja)</text>
<circle cx="498" cy="186" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="498" y="186">5</text>
<text class="dl" x="518" y="190"><tspan class="dlb">Ordena</tspan> al Controlador (PC) abrir el molinete</text>
<text class="tg" x="486" y="232">DECIDE SI SE ABRE · DA LA ORDEN A EL CONTROLADOR (PC)</text>

<!-- Panel -->
<rect class="bx" x="1040" y="64" width="230" height="92" rx="10"/>
<text class="ti" x="1056" y="94">Panel de vigilancia</text>
<text class="su" x="1056" y="114">en la pantalla del vigilante</text>
<text class="tg" x="1056" y="142">PORTAL WEB</text>
<path d="M930 110 L1034 110" stroke="#1f67a8" stroke-width="2" fill="none" marker-end="url(#mb)"/>
<circle cx="982" cy="110" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="982" y="110">7</text>
<text class="lb" x="982" y="92" text-anchor="middle">registra la salida</text>

<!-- No se abre si -->
<rect x="1040" y="176" width="330" height="150" rx="10" fill="#fdf1f0" stroke="#c0392b" stroke-width="1.5"/>
<text class="xt" x="1056" y="199">✕ No se abre si…</text>
<text class="xl" x="1056" y="221">• no pasa su DNI</text>
<text class="xl" x="1056" y="239">• el DNI no está registrado</text>
<text class="xl" x="1066" y="257">(el Panel muestra “No registrado”)</text>
<text class="xl" x="1056" y="275">• sin internet, si no está en la lista guardada</text>
<text class="su" x="1056" y="299">En cada caso suena el aviso de salida</text>
<text class="su" x="1056" y="315">denegada.</text>

<!-- Garita -->
<rect class="zone" x="150" y="364" width="1220" height="350" rx="12"/>
<text class="zl" x="1352" y="388" text-anchor="end">PUNTO DE SALIDA · GARITA</text>

<text class="ti" x="74" y="408" text-anchor="middle">Personal</text>
<g fill="#c77700" transform="translate(52 420)"><circle cx="22" cy="14" r="13"/><path d="M2 88 L2 44 Q2 32 14 32 L30 32 Q42 32 42 44 L42 88 Z"/><rect x="6" y="86" width="12" height="36" rx="3"/><rect x="26" y="86" width="12" height="36" rx="3"/></g>

<rect class="bx" x="190" y="404" width="180" height="96" rx="10"/>
<text class="ti" x="206" y="434">Lector de DNI</text>
<text class="su" x="206" y="454">Syble XB-7705H · salida</text>
<text class="tg" x="206" y="486">USB-COM · LEE EL REVERSO</text>

<rect class="bxm" x="420" y="396" width="320" height="132" rx="10"/>
<text class="ti" x="436" y="424">Controlador (PC)</text>
<text class="su" x="436" y="444">en la garita · solo lectores y relés</text>
<rect x="436" y="458" width="140" height="56" rx="8" fill="#fdf1f0" stroke="#c0392b" stroke-width="1.2"/>
<text class="dlb" x="448" y="480">Relé de aviso</text>
<text class="tg" x="448" y="502">SALIDA DENEGADA</text>
<rect x="588" y="458" width="140" height="56" rx="8" fill="#eef7f2" stroke="#23865a" stroke-width="1.2"/>
<text class="dlb" x="600" y="480">Relé de salida</text>
<text class="tg" x="600" y="502">PULSO DE 1 S</text>

<rect x="820" y="404" width="240" height="84" rx="10" fill="#ffffff" stroke="#d5dce2" stroke-dasharray="4 4"/>
<text class="dlb" x="838" y="432">Sin rostro ni alcohol</text>
<text class="su" x="838" y="452">en la salida solo se pide el DNI;</text>
<text class="su" x="838" y="469">no se exige un ingreso previo</text>

<rect x="1090" y="404" width="260" height="124" rx="10" fill="#ffffff" stroke="#d5dce2" stroke-dasharray="4 4"/>
<text class="dlb" x="1108" y="432">Sin internet</text>
<text class="su" x="1108" y="452">el Controlador (PC) deja salir a quien está</text>
<text class="su" x="1108" y="469">en la lista del personal guardada</text>
<text class="su" x="1108" y="486">(se renueva cada 10 min) y envía</text>
<text class="su" x="1108" y="503">las salidas al volver la conexión</text>

<rect class="bx" x="560" y="590" width="200" height="100" rx="10"/>
<text class="ti" x="576" y="620">Molinete de salida</text>
<text class="su" x="576" y="640">TS2000 Plus</text>
<text class="tg" x="576" y="676">BORNERA J3 · K1 + COM</text>

<rect x="190" y="592" width="190" height="66" rx="10" fill="#fdf1f0" stroke="#c0392b" stroke-width="1.2"/>
<text class="dlb" x="206" y="618">Luz o sirena</text>
<text class="su" x="206" y="638">aviso de salida denegada</text>

<!-- 1 persona → lector -->
<path d="M104 452 L184 452" stroke="#c77700" stroke-width="2.4" fill="none" marker-end="url(#mp)"/>
<circle cx="144" cy="452" r="12" fill="#c77700" stroke="#fff" stroke-width="2"/><text class="num" x="144" y="452">1</text>
<text class="lp" x="144" y="432" text-anchor="middle">pasa su DNI</text>
<!-- 2 lector → Controlador (PC) -->
<path d="M370 452 L414 452" stroke="#1f67a8" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" fill="none" marker-end="url(#mb)"/>
<circle cx="392" cy="452" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="392" y="452">2</text>
<text class="tg" x="392" y="484" text-anchor="middle" fill="#1f67a8">USB</text>
<!-- 3 Controlador (PC) → nube -->
<path d="M520 396 L520 256" stroke="#1f67a8" stroke-width="2" fill="none" marker-end="url(#mb)"/>
<circle cx="520" cy="320" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="520" y="320">3</text>
<text class="lb" x="502" y="314" text-anchor="end">envía el DNI</text><text class="lb" x="502" y="331" text-anchor="end">por internet</text>
<!-- 5 nube → Controlador (PC) -->
<path d="M660 250 L660 390" stroke="#1f67a8" stroke-width="2" fill="none" marker-end="url(#mb)"/>
<circle cx="660" cy="320" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="660" y="320">5</text>
<text class="lb" x="678" y="314">orden de apertura</text><text class="lb" x="678" y="331">(pulso de 1 s)</text>
<!-- 6 relé → molinete -->
<path d="M660 514 L660 584" stroke="#23865a" stroke-width="4" fill="none" marker-end="url(#mg)"/>
<circle cx="660" cy="550" r="12" fill="#23865a" stroke="#fff" stroke-width="2"/><text class="num" x="660" y="550">6</text>
<text class="lg" x="680" y="546">señal</text>
<text class="tg" x="680" y="566" fill="#23865a">NO+COM → J3</text>
<!-- aviso → luz o sirena -->
<path d="M506 514 L506 625 L386 625" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#mr)"/>
<text class="su" x="516" y="574">si se deniega</text>
<!-- sale -->
<path d="M760 640 L830 640" stroke="#c77700" stroke-width="2.4" fill="none" marker-end="url(#mp)"/>
<text class="lp" x="795" y="628" text-anchor="middle">sale</text>

<!-- Paso a paso -->
<text class="h2" x="40" y="760">Paso a paso</text>
<circle cx="52" cy="790" r="12" fill="#c77700" stroke="#fff" stroke-width="2"/><text class="num" x="52" y="790">1</text>
<text class="st" x="72" y="794">La persona pasa su DNI (reverso) por el lector de salida.</text>
<circle cx="52" cy="820" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="52" y="820">2</text>
<text class="st" x="72" y="824">El lector envía el número al Controlador (PC) de la garita (USB).</text>
<circle cx="52" cy="850" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="52" y="850">3</text>
<text class="st" x="72" y="854">El Controlador (PC) envía el DNI al servidor en la nube, por internet.</text>
<circle cx="52" cy="880" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="52" y="880">4</text>
<text class="st" x="72" y="884">El servidor verifica que esté registrado y guarda la salida.</text>
<circle cx="732" cy="790" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="732" y="790">5</text>
<text class="st" x="752" y="794">El servidor ordena al Controlador (PC) abrir el molinete de salida.</text>
<circle cx="732" cy="820" r="12" fill="#23865a" stroke="#fff" stroke-width="2"/><text class="num" x="732" y="820">6</text>
<text class="st" x="752" y="824">El Controlador (PC) activa el relé de salida (pulso de 1 s) y el molinete se abre.</text>
<circle cx="732" cy="850" r="12" fill="#1f67a8" stroke="#fff" stroke-width="2"/><text class="num" x="732" y="850">7</text>
<text class="st" x="752" y="854">La salida aparece en el Panel de vigilancia.</text>

<!-- Leyenda -->
<path d="M40 918 L84 918" stroke="#c77700" stroke-width="2.4" fill="none" marker-end="url(#mp)"/>
<text class="dl" x="96" y="922">acción de la persona</text>
<path d="M256 918 L300 918" stroke="#1f67a8" stroke-width="2" fill="none" marker-end="url(#mb)"/>
<text class="dl" x="312" y="922">datos por internet</text>
<path d="M460 918 L504 918" stroke="#1f67a8" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" fill="none" marker-end="url(#mb)"/>
<text class="dl" x="516" y="922">cable USB</text>
<path d="M620 918 L664 918" stroke="#23865a" stroke-width="4" fill="none" marker-end="url(#mg)"/>
<text class="dl" x="676" y="922">señal eléctrica que abre el molinete</text>
<path d="M920 918 L964 918" stroke="#c0392b" stroke-width="2.4" fill="none" marker-end="url(#mr)"/>
<text class="dl" x="976" y="922">aviso cuando se deniega (luz o sirena)</text>
</svg>
