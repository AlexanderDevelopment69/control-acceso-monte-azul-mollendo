<path class="fl" d="M962 176 L1040 242" marker-end="url(#p)"/>
<path class="fl" d="M592 297 L1040 484" marker-end="url(#p)"/>
<rect x="760" y="364" width="120" height="30" fill="#fff"/>
<text class="et" x="820" y="386">Internet</text>
